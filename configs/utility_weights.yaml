# ============================================================
# EFADT Utility Function Weights
# Tuned via grid search; see Section 5.5
# ============================================================

# Multi-objective agent weights (sum to 1.0)
agent_weights:
  lambda_e: 0.5       # energy minimization weight
  lambda_c: 0.35      # comfort maximization weight
  lambda_d: 0.15      # crowd density minimization weight

# Trust score weights (sum to 1.0)
trust_weights:
  eta1: 0.5           # SHAP coherence term
  eta2: 0.3           # comfort alignment term
  eta3: 0.2           # crowd safety alignment term

# Ablation variant configurations
ablation_variants:
  energy_only:        # -MOO: single objective
    lambda_e: 1.0
    lambda_c: 0.0
    lambda_d: 0.0

  comfort_priority:   # Comfort-first configuration
    lambda_e: 0.2
    lambda_c: 0.6
    lambda_d: 0.2

  safety_priority:    # Safety-first configuration
    lambda_e: 0.2
    lambda_c: 0.2
    lambda_d: 0.6
