[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "efadt-smart-campus"
version = "1.0.0"
description = "Explainable Federated Agentic Digital Twin for Smart Campus Resource Optimization"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["federated-learning", "digital-twin", "explainable-ai", "smart-campus", "energy-optimization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["data*", "models*", "federated*", "digital_twin*", "agent*",
           "xai*", "pipeline*", "evaluation*", "api*", "governance*"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "W", "I", "N"]
ignore = ["E501", "E402", "F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
timeout = 120
